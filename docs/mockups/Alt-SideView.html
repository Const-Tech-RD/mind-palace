<style>

.mp-h{font-family:'Fraunces',Georgia,serif;font-weight:600;font-variation-settings:"SOFT" 100,"WONK" 0}

.tip{opacity:0;transition:opacity .15s;pointer-events:none}
.room:hover .tip{opacity:1}
